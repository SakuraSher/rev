#adding to github
name: build-ecs

on:
  # push:
  #   branches: ["main"]
  workflow_dispatch:

env:
    REGION: ap-south-1
    ECR_REPO: 167251111434.dkr.ecr.ap-south-1.amazonaws.com/bootcamp/day8
    ACCOUNT_ID: "167251111434"
    ECR_TAG: ${{github.sha}}

  
jobs:
  
  buildcode:
    runs-on: ubuntu-latest
    env:
      path: rev/src/
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: install buildx
        uses: docker/setup-buildx-action@v3
      - name: Configure AWS crecdentials
        uses: aws-actions/configure-aws-credentials@v4 
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.REGION }}
      - name: ecr login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image
        run: |
          pwd
          cd ${{ env.path }}
          docker buildx build --platform linux/amd64 --push -t ${{ env.ECR_REPO }}:${{ env.ECR_TAG }} -t ${{ env.ECR_REPO }}:latest .
          
         