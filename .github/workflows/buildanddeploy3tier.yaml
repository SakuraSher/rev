name: build and deploy 3-tier application
on:
  push:
    # branches:
    #   - main
    # paths:
    #   - kubernetes/3-tier-app/**
  workflow_dispatch:

env:
  REGION: ap-south-1
  ACCOUNT_ID: "167251111434"
  BACKEND_REPO: augk8s26-backend
  FRONTEND_REPO: augk8s26-frontend
  IMAGE_TAG: ${{ github.sha }}
  path: kubernetes/3-tier-app

permissions:
  contents: read
  id-token: write


jobs:
 
  build-service:
    strategy:
      matrix:
         service:
          - name: "frontend"
            repo: "augk8s26-frontend"
          - name: "backend"
            repo: "augk8s26-backend" 
    runs-on: ubuntu-latest
    
    steps:
        - name: checkout
          uses: actions/checkout@v4
      
        - name: install buildx
          uses: docker/setup-buildx-action@v3
        - name: Configure AWS credentials
          uses: aws-actions/configure-aws-credentials@v4
          with:
            role-to-assume: arn:aws:iam::167251111434:role/githubactionrole
            aws-region: ${{env.REGION}}
        - name: ecr login
          uses: aws-actions/amazon-ecr-login@v2
        - name: Build and push image ${{matrix.service.name}}
          run: |
             pwd
             ls -ltr
             cd kubernetes/3-tier-appsrc/${{matrix.service.name}}
             pwd
             ls -ltr
             docker buildx build --platform linux/amd64 --push \ 
             -t ${{env.ACCOUNT_ID}}.dkr.ecr.${{env.REGION}}.amazonaws.com/${{matrix.service.name}}:${{env.IMAGE_TAG}} \
             -t ${{env.ACCOUNT_ID}}.drk.ecr.${{env.REGION}}.amazonaws.com/${{matrix.service.name}}:latest . 










